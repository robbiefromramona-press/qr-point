# The frontend is static; the real work happens in netlify/functions, which
# Netlify already bundles with esbuild (see [functions] below). The build
# command now also minifies the browser-side files in place, in Netlify's own
# checkout -- your source files are never touched by it.
#
# This one is cosmetic rather than protective: there is nothing valuable in
# public/ to hide. The parsing, ID minting, QR generation and database writes
# are all server-side already, which is the right way round. See
# AUDIT-REPORT.md -- what this repo actually needs is auth and rate limiting on
# the four functions, not minification.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npx --yes html-minifier-terser@7.2.0 --minify-js --minify-css --remove-comments --input-dir public --output-dir public --file-ext html && npx --yes esbuild@0.25.0 public/assets/*.js --minify --allow-overwrite --outdir=public/assets"

[functions]
  node_bundler = "esbuild"

# Pretty lookup URLs: https://<site>/p/{pointID}  ->  serves the lookup page,
# which reads the ID from the URL path via JS (see public/p/index.html).
[[redirects]]
  from = "/p/*"
  to = "/p/index.html"
  status = 200

# API-style aliases so the frontend code reads cleanly.
[[redirects]]
  from = "/api/process-csv"
  to = "/.netlify/functions/process-csv"
  status = 200

[[redirects]]
  from = "/api/get-point"
  to = "/.netlify/functions/get-point"
  status = 200

[[redirects]]
  from = "/api/search-points"
  to = "/.netlify/functions/search-points"
  status = 200

[[redirects]]
  from = "/api/qr-batch"
  to = "/.netlify/functions/qr-batch"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
